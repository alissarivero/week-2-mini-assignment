name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 12:00 UTC
    - cron: "0 12 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check analysis.py visuals.py question1.py tests

      - name: Lint
        run: python -m flake8 analysis.py visuals.py question1.py tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
        env:
          MPLBACKEND: Agg
